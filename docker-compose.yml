version: '3.8'

services:
  web:
    build: .
    container_name: ocupacao_docente_web
    restart: always
    ports:
      - "8080:80"
    volumes:
      - .:/var/www/html
    environment:
      DB_HOST: db
      DB_USER: root
      DB_PASS: root
      DB_NAME: gestao_escolar
      DB_PORT: 3306
    depends_on:
      - db

  db:
    image: mariadb:10.6
    container_name: ocupacao_docente_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: gestao_escolar
    ports:
      - "3308:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./Sql/gestao_escolar.sql:/docker-entrypoint-initdb.d/01_init.sql:ro

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: ocupacao_docente_phpmyadmin
    restart: always
    ports:
      - "8081:80"
    environment:
      PMA_HOST: db
      MYSQL_ROOT_PASSWORD: root
    depends_on:
      - db

volumes:
  db_data:
